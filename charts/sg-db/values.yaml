# Engine: postgres | mysql
engine: postgres

images:
  postgres: postgres:17
  mysql: mysql:8.4
  awscli: public.ecr.aws/aws-cli/aws-cli:2.27.0

database:
  name: app          # the app database (created on first start)
  user: app          # the app user: full rights on database.name only

auth:
  adminPassword: ""  # required. Template: ${seagit.secrets.DB_ADMIN_PASSWORD}
  appPassword: ""    # required. Template: ${seagit.secrets.DB_APP_PASSWORD}

storage:
  size: 20Gi
  storageClass: ebs-csi-slow-del

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }

# cluster: in-cluster Service only. vpc: also an internal NLB (never internet-facing).
reach: cluster

# Keep the database off spot nodes: its data is a zonal EBS volume (2026-09-27 qdrant incident).
avoidSpot: true

seagit:
  deploymentId: ""   # ${seagit.app.deployment_id}: owner label so platform Stop/Start finds the StatefulSet

serviceAccount:
  name: ""           # ${seagit.app.sa_name}: the name the IRSA role trusts
  roleArn: ""        # ${seagit.app.role_arn}

backup:
  bucket: ""         # ${stack_bucket.name}
  region: ""         # ${ctx.region}
  schedule: "0 3 * * *"
  retentionDays: 7
  onDelete: true     # false = "Delete anyway": the pre-delete hook becomes a no-op
  firstBackup: true  # post-install backup. Keep true in production: it is also what makes the
                     # platform deploy this chart through Tier B (install hooks). CI sets false.
  activeDeadlineSeconds: 3600
  endpointUrl: ""    # tests only (MinIO); empty = real S3
