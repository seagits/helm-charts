{{- include "sg-notebooks.validate" . }}
# Every notebook server runs as this ServiceAccount. Its IRSA role (made by the platform) reaches the
# stack bucket and nothing else, so notebooks never hold AWS keys.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels: {{- include "sg-notebooks.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . }}
  {{- end }}
automountServiceAccountToken: false
