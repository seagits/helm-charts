{{- /*
configurable-http-proxy reads its TLS certificate once, at start. cert-manager renews the secret 30
days before expiry, so a scheduled restart of the proxy picks the new certificate up long before the
old one lapses. Notebook servers are not touched; browser tabs reconnect within seconds.
Dedicated exposure only: on the shared entrance TLS ends at the entrance, which reloads on its own.
*/ -}}
{{- if eq (toString .Values.public.exposure) "dedicated" }}
{{- $proxy := include "jupyterhub.proxy.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cert-reload
  labels: {{- include "sg-notebooks.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cert-reload
  labels: {{- include "sg-notebooks.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ $proxy | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cert-reload
  labels: {{- include "sg-notebooks.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cert-reload
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-cert-reload
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-cert-reload
  labels: {{- include "sg-notebooks.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.public.certReloadSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels: {{- include "sg-notebooks.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ .Release.Name }}-cert-reload
          restartPolicy: Never
          {{- if or .Values.nodeSelector .Values.tolerations }}
          {{- include "sg-notebooks.placement" . | trim | nindent 10 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: restart
              image: {{ .Values.images.kubectl }}
              args: ["rollout", "restart", "deployment/{{ $proxy }}", "--namespace={{ .Release.Namespace }}"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
{{- end }}
