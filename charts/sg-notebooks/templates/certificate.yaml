{{- if .Values.public.certIssuer }}
# The certificate for the hub's name and its per-cluster leaf. There is no Ingress for cert-manager's
# ingress-shim to read, so the chart asks for it directly (same pattern as the Redis stack).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-tls
  labels: {{- include "sg-notebooks.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.public.tlsSecret }}
  {{- with .Values.seagit.deploymentId }}
  # cert-manager never deletes a Certificate's secret; the owner label lets the platform's
  # owner-label destroy cleanup remove it with the stack.
  secretTemplate:
    labels:
      seagit.io/deployment: {{ . }}
  {{- end }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.public.certIssuer }}
  dnsNames:
    - {{ .Values.public.host }}
    - {{ .Values.public.leafHost }}
{{- end }}
