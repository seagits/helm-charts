{{- if and .Values.uploads.queueUrl (not .Values.uploads.bucket) }}{{ fail "uploads.queueUrl requires uploads.bucket" }}{{- end }}
{{- $queueUrl := .Values.eventsQueueUrl | default .Values.uploads.queueUrl }}
{{- $hasEventSources := false }}
{{- range .Values.sources }}{{- if (include "rag-sync.syncOf" . | fromJson).events }}{{- $hasEventSources = true }}{{- end }}{{- end }}
{{- if and $hasEventSources (not $queueUrl) }}{{ fail "one or more sources use sync: events/events_sweep but neither eventsQueueUrl nor uploads.queueUrl is set" }}{{- end }}
{{- if $queueUrl }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-sync.fitName" (dict "name" (printf "%s-uploads-events" .Release.Name) "max" 63) }}
  labels: {{- include "rag-sync.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rag-sync.labels" . | nindent 6 }}
      app.kubernetes.io/component: uploads-events
  template:
    metadata:
      labels:
        {{- include "rag-sync.labels" . | nindent 8 }}
        app.kubernetes.io/component: uploads-events
    spec: {{- include "rag-sync.podSpec" (dict "root" . "src" (dict "id" "uploads-events") "events" true "restartPolicy" "Always") | nindent 6 }}
{{- end }}
