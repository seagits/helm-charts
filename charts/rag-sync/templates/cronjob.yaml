{{- if and .Values.uploads.bucket (not .Values.existingServiceAccount) }}{{ fail "uploads.bucket requires existingServiceAccount" }}{{- end }}
{{- range .Values.sources }}
{{- if (include "rag-sync.syncOf" . | fromJson).schedule }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rag-sync.cronJobName" (dict "root" $ "src" .) }}
  labels: {{- include "rag-sync.labels" $ | nindent 4 }}
spec:
  schedule: {{ required (printf "source %s: schedule is required when sync/mode enables a scheduled run" .id) .schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $.Values.activeDeadlineSeconds }}
      template: {{- include "rag-sync.podTemplate" (dict "root" $ "src" .) | nindent 8 }}
{{- end }}
{{- end }}
{{- if .Values.uploads.bucket }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rag-sync.fitName" (dict "name" (printf "%s-cron-uploads" .Release.Name) "max" 52) }}
  labels: {{- include "rag-sync.labels" . | nindent 4 }}
spec:
  schedule: {{ if .Values.uploads.queueUrl }}{{ .Values.uploads.safetySchedule | quote }}{{ else }}{{ .Values.uploads.schedule | quote }}{{ end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template: {{- include "rag-sync.podTemplate" (dict "root" . "src" (dict "id" "uploads") "uploads" true) | nindent 8 }}
{{- end }}
