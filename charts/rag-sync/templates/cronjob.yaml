{{- range .Values.sources }}
{{- if has (.mode | default "once") (list "schedule" "both") }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rag-sync.cronJobName" (dict "root" $ "src" .) }}
  labels: {{- include "rag-sync.labels" $ | nindent 4 }}
spec:
  schedule: {{ required "schedule is required for mode schedule/both" .schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $.Values.activeDeadlineSeconds }}
      template: {{- include "rag-sync.podTemplate" (dict "root" $ "src" .) | nindent 8 }}
{{- end }}
{{- end }}
