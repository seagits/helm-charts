{{- range .Values.sources }}
{{- if has (.mode | default "once") (list "once" "both") }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rag-sync.jobName" (dict "root" $ "src" .) }}
  labels: {{- include "rag-sync.labels" $ | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ $.Values.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template: {{- include "rag-sync.podTemplate" (dict "root" $ "src" .) | nindent 4 }}
{{- end }}
{{- end }}
